<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="body-container">
        <div class="navbar-div">
            <div class="yt-signature">
                <div class="youtube-logo">
                    <img id="youtube-logo" src="./YT-logo.png" alt="youtube-logo">
                </div>
                <div>
                    <h2>Youtube</h2>
                </div>
            </div>
            <div class="search-bar">
                <input type="text" placeholder="Search">
                <button>Search</button>
            </div>
            <div class="profile-details">
                <div>
                    <img class="avatar" src="./avatar.png" alt="avatar">
                </div>
                <div>
                    <select name="profile-details" id="profile-details-dropdown">
                        <option value="profile">User</option>
                        <option value="profile">Profile</option>
                        <option value="profile">Settings</option>
                        <option value="profile">Account</option>
                        <option value="profile">Privacy</option>
                    </select>
                </div>
                
            </div>
        </div>

        <div class="main-content">
            <div class="vertical-navbar">
                <a href="https://www.youtube.com/">Home</a>
                <a href="https://www.youtube.com/shorts/">Shorts</a>
                <a href="https://www.youtube.com/feed/subscriptions">Subscriptions</a>
                <a href="https://www.youtube.com/feed/history">History</a>
                <a href="https://www.youtube.com/feed/playlists">Playlists</a>
                <a href="https://studio.youtube.com/channel/UCvuoeg3y1Okr-Ru1nTVmNBw/videos/upload?filter=%5B%5D&sort=%7B%22columnType%22%3A%22date%22%2C%22sortOrder%22%3A%22DESCENDING%22%7D">Your Videos</a>
                <a href="http://youtube.com/feed/courses">Courses</a>
            </div>
            <div class="video-list">
                <div id="video1">
                    <div id="video-picture-link">
                        <div class="picture">
                            <a href="https://www.youtube.com/watch?v=7Dh73z3icd8&list=PLu0W_9lII9aiXlHcLx-mDH1Qul38wD3aR">
                                <img src="https://www.google.com/url?sa=i&url=https%3A%2F%2Fcreazilla.com%2Fmedia%2Ficon%2F3217127%2Fnumber-square-one&psig=AOvVaw2vKJqC0dlkgbHflXuh45v1&ust=1737274836526000&source=images&cd=vfe&opi=89978449&ved=0CBQQjRxqFwoTCICE253r_ooDFQAAAAAdAAAAABAE" alt="video-1">
                            </a>
                        </div>
                        <div>
                            <a href="">
                                <label for="">video 1</label>
                            </a>
                            
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

</html>
